services:
  postgres:
    image: postgres:17-alpine
    container_name: logitrack-postgres
    environment:
      POSTGRES_DB: logitrack_pro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logitrack_pro"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: logitrack-backend

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/logitrack_pro
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080

    container_name: logitrack-frontend

    depends_on:
      - backend

    ports:
      - "5173:80"

volumes:
  postgres_data:
